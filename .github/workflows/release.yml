name: Build Release

on:
  push:
    tags:
      - 'v*'   # Triggers on any tag like v1.0.0, v0.2.1, etc.

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name gtnh-config-helper-linux-x64 gtnh-config-helper.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/gtnh-config-helper-linux-x64


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name gtnh-config-helper-win-x64 gtnh-config-helper.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/gtnh-config-helper-win-x64.exe


  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create a release

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gtnh-config-helper.py
            gtnh-config-helper-template.toml
            dist/gtnh-config-helper-linux-x64
            dist/gtnh-config-helper-win-x64.exe
          generate_release_notes: true
