title = "Configuration file for GTNH Config Helper"

# ---------------------------------------------------------------------------- #
#  GTNH Config Helper — Template                                                #
#                                                                               #
#  Sections:                                                                    #
#    [Config.text.*]  — Find/replace strings inside config files                #
#    [Config.mods.*]  — Download and/or disable mods                            #
#                                                                               #
#  Common keys (available in all entries):                                      #
#    side = "client" | "server" | "both"  (default: "both")                    #
#                                                                               #
# ---------------------------------------------------------------------------- #


[Settings]
# Optional self-update. If both keys are present, on startup the tool fetches the
# config at update_url; if its config_version is greater than the local one, the
# local file is backed up and replaced, then processing continues with the new config.
# On any network/parse/write error the local config is kept and the tool continues.
#config_version = 1
#update_url = 'https://example.com/gtnh/config-file.toml'


# ============================================================================ #
#  CONFIG FILE REPLACEMENTS                                                     #
#                                                                               #
#  Each [Config.text.<name>] entry targets one file and contains one or more   #
#  [[Config.text.<name>.replacements]] tables, each describing a find/replace. #
#                                                                               #
#  Entry-level keys:                                                            #
#    file_path   — Config file path; client: relative to <instance>/.minecraft  #
#                  server: relative to <server> root (no ".minecraft" prefix)   #
#    side        — "client" | "server" | "both"  (default: "both")             #
#                                                                               #
#  Per-replacement keys:                                                        #
#    finds_str   — String (or regex pattern) to search for                     #
#    new_str     — Replacement string                                           #
#    use_regex   — true | false  (default: false)                               #
# ============================================================================ #

# --- Basic example: simple find/replace, applies to both sides ---
[Config.text.GT-Pollution]
file_path = 'config/GregTech/Pollution.cfg'

[[Config.text.GT-Pollution.replacements]]
finds_str = 'B:"Activate Pollution"=true'
new_str = 'B:"Activate Pollution"=false'

# --- Multiple replacements in the same file, mixing regex and plain ---
[Config.text.GT-Misc]
file_path = 'config/GregTech/Pollution.cfg'

[[Config.text.GT-Misc.replacements]]
finds_str = 'B:"Activate Pollution"=(true|false)'
new_str = 'B:"Activate Pollution"=false'
use_regex = true

[[Config.text.GT-Misc.replacements]]
finds_str = 'something_else=(true|false)'
new_str = 'something_else=false'
use_regex = true

# --- Client-only example ---
[Config.text.JourneyMap-Waypoints]
file_path = 'config/darkerer.cfg'
side = 'client'

[[Config.text.JourneyMap-Waypoints.replacements]]
finds_str = 'S:mode=EVERYWHERE'
new_str = 'S:mode=MOON_PHASE'

# --- Server-only example ---
[Config.text.Server-Tickrate]
file_path = 'config/somemod.cfg'
side = 'server'

[[Config.text.Server-Tickrate.replacements]]
finds_str = 'I:someconf=20'
new_str = 'I:someconf=40'

# --- Multiline example: inserting a line into a block ---
# See TOML Documentation https://toml.io/en/v1.1.0#string
[Config.text.ServerUtilities-GameRules-Content]
file_path = 'serverutilities/serverutilities.cfg'

[[Config.text.ServerUtilities-GameRules-Content.replacements]]
finds_str = '''
S:flip_game_rules_when_empty_rules <

         >
'''
new_str = '''
S:flip_game_rules_when_empty_rules <
            doDaylightCycle
         >
'''


# ============================================================================ #
#  MOD MANAGEMENT                                                               #
#                                                                               #
#  Required keys: (at least one of download_url or disable)                    #
#    download_url — Direct URL to the .jar file to download                    #
#    disable      — Regex pattern matching jars to rename to .jar.bak          #
#                                                                               #
#  Optional keys:                                                               #
#    side         — "client" | "server" | "both"  (default: "both")            #
#    mod_dir      — Mods dir (default "mods"); client: under .minecraft         #
#                   (default: .minecraft/mods for client, mods for server)     #
# ============================================================================ #

# --- Download only: add a mod that isn't in the default pack ---
[Config.mods.WorldEdit]
download_url = 'https://github.com/GTNewHorizons/worldedit-gtnh/releases/download/v0.0.9/worldedit-v0.0.9.jar'
side = 'server'

# --- Download + disable: replace an existing mod with a specific version ---
[Config.mods.JourneyMap]
download_url = 'https://github.com/TeamJM/journeymap-legacy/releases/download/5.2.16/journeymap-1.7.10-5.2.16-unlimited.jar'
disable = 'journeymap-1\.7\.10-5\.\d+\.\d{1,2}-(fairplay|unlimited)\.jar'
side = 'both'

# --- Disable only: remove a mod without replacing it ---
[Config.mods.Darkerer]
disable = 'darkerer-1\.\d+\.\d{1,2}\.jar'
side = 'client'

# --- Custom mod_dir example ---
[Config.mods.shaderpack-modernity]
mod_dir = 'shaderpacks'
download_url  = 'https://cdn.example.com/shaderpack/ComplementaryReimagined_r5.6.1.zip'
side = 'client'